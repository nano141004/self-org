[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pal"
version = "0.1.0"
description = "Headless, local-first Personal Knowledge Engine and private assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "self-org" }]
dependencies = [
    "typer>=0.12",
    "fastmcp>=2.0",
    "litellm>=1.75",
    "python-frontmatter>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-ulid>=2.7",
    "httpx>=0.27",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
]

[project.scripts]
pal = "pal.cli.main:app"
pal-mcp = "pal.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["pal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: tests that hit a real LLM provider (excluded by default)",
]
